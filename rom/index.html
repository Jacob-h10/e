<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Retro</title>
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuse.js CDN for Fuzzy Search -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nes: {
                            950: '#07090c',
                            900: '#0d1117',
                            800: '#161b22',
                            700: '#30363d',
                            600: '#484f58',
                            accent: '#2ea043'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-nes-950 text-slate-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">

    <header class="sticky top-0 z-50 bg-nes-950/90 backdrop-blur-md border-b border-nes-700/80">
        <div class="w-full px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3.5 w-full md:w-auto">
                <div class="w-10 h-10 rounded-xl bg-nes-800 border border-nes-700 flex items-center justify-center shrink-0 text-emerald-400">
                    <img src="../icon.svg" class="w-6 h-6">
                </div>
                <div>
                    <h1 id="catalog-title" class="text-xl font-bold tracking-wide text-white"></h1>
                    <p class="text-xs text-slate-400 font-mono">Controls: G, F, Enter, Shift, Arrow Keys</p>
                </div>
            </div>

            <!-- Controls (System Switcher & Search Bar) -->
            <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                <!-- System Switcher -->
                <div class="flex bg-nes-900 border border-nes-700 rounded-xl p-1 w-full sm:w-auto shrink-0">
                    <button id="btn-nes" class="flex-1 sm:flex-initial px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-500 text-black transition-colors" data-system="nes">NES</button>
                    <button id="btn-snes" class="flex-1 sm:flex-initial px-3 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-colors" data-system="snes">SNES</button>
                    <button id="btn-all" class="flex-1 sm:flex-initial px-3 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-colors" data-system="all">ALL</button>
                </div>

                <!-- Search Bar -->
                <div class="w-full sm:w-80 relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </span>
                    <input type="text" id="search" placeholder="Search games..." autocomplete="off" spellcheck="false"
                        class="w-full pl-10 pr-16 py-2.5 bg-nes-900 border border-nes-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors">
                    <span id="game-count" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs text-emerald-400 font-mono font-medium">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full px-6 py-8">
        <!-- Loading State -->
        <div id="loading-state" class="flex flex-col items-center justify-center py-32 space-y-3">
            <div class="w-8 h-8 border-3 border-nes-700 border-t-emerald-400 rounded-full animate-spin"></div>
            <p id="loading-text" class="text-xs font-mono uppercase tracking-wider text-slate-400">Loading game library...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-32 text-center">
            <div class="w-12 h-12 bg-nes-900 rounded-xl border border-nes-700 flex items-center justify-center text-slate-400 mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h3 class="text-sm font-semibold text-slate-200">No games found</h3>
            <p class="text-xs text-slate-500 mt-0.5">Try searching for something else.</p>
        </div>

        <!-- Games Grid Container (100% Full Width) -->
        <div id="container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-3.5"></div>

        <!-- Infinite Scroll Sentinel Target -->
        <div id="scroll-sentinel" class="py-12 flex justify-center items-center">
            <div id="scroll-loader" class="hidden w-6 h-6 border-2 border-nes-700 border-t-emerald-400 rounded-full animate-spin"></div>
        </div>
    </main>

    <footer class="border-t border-nes-700/80 bg-nes-950 py-6 text-center text-xs text-slate-500 font-mono">
        <p>Retro Game Catalog</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("container");
            const searchInput = document.getElementById("search");
            const gameCountEl = document.getElementById("game-count");
            const loadingState = document.getElementById("loading-state");
            const loadingText = document.getElementById("loading-text");
            const emptyState = document.getElementById("empty-state");
            const scrollLoader = document.getElementById("scroll-loader");
            const scrollSentinel = document.getElementById("scroll-sentinel");
            const catalogTitle = document.getElementById("catalog-title");
            const btnNes = document.getElementById("btn-nes");
            const btnSnes = document.getElementById("btn-snes");
            const btnAll = document.getElementById("btn-all");

            let currentSystem = "nes";
            let allGames = [];
            let filteredGames = [];
            let displayedCount = 0;
            const BATCH_SIZE = 60;
            let fuse = null;

            const systems = {
                nes: { title: "NES GAMES", dataPath: "./data/nes", gitPath: "retro1" },
                snes: { title: "SNES GAMES", dataPath: "./data/snes", gitPath: "retro2" },
                all: { title: "ALL GAMES", dataPaths: ["./data/nes", "./data/snes"] }
            };

            function updateButtonStyles(activeKey) {
                [btnNes, btnSnes, btnAll].forEach(btn => {
                    if (btn.dataset.system === activeKey) {
                        btn.className = "flex-1 sm:flex-initial px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-500 text-black transition-colors";
                    } else {
                        btn.className = "flex-1 sm:flex-initial px-3 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-colors";
                    }
                });
            }

            function loadSystem(systemKey) {
                currentSystem = systemKey;
                const config = systems[systemKey];
                
                catalogTitle.textContent = config.title;
                loadingState.style.display = "flex";
                loadingText.textContent = `Loading ${systemKey.toUpperCase()} library...`;
                container.innerHTML = "";
                emptyState.style.display = "none";
                searchInput.value = "";
                allGames = [];
                filteredGames = [];
                displayedCount = 0;

                updateButtonStyles(systemKey);

                if (systemKey === 'all') {
                    // Fetch both catalogs simultaneously for the "ALL" section
                    Promise.all([
                        fetch(systems.nes.dataPath).then(res => res.ok ? res.text() : ""),
                        fetch(systems.snes.dataPath).then(res => res.ok ? res.text() : "")
                    ])
                    .then(([nesData, snesData]) => {
                        const nesList = nesData.split("\n").map(l => l.trim()).filter(l => l !== "").map(name => ({ name, gitPath: systems.nes.gitPath }));
                        const snesList = snesData.split("\n").map(l => l.trim()).filter(l => l !== "").map(name => ({ name, gitPath: systems.snes.gitPath }));
                        
                        allGames = [...nesList, ...snesList];
                        initFuse();
                        loadingState.style.display = "none";
                        filterAndRender("", true);
                    })
                    .catch(error => {
                        console.error("Error fetching ALL lists:", error);
                        loadingState.innerHTML = `<div class="text-rose-400 text-xs font-mono font-medium">Failed to load games list.</div>`;
                    });
                } else {
                    // Fetch single system
                    fetch(config.dataPath)
                        .then(response => {
                            if (!response.ok) throw new Error("Network response was not ok");
                            return response.text();
                        })
                        .then(data => {
                            allGames = data.split("\n")
                                .map(line => line.trim())
                                .filter(line => line !== "")
                                .map(name => ({ name, gitPath: config.gitPath }));
                            
                            initFuse();
                            loadingState.style.display = "none";
                            filterAndRender("", true);
                        })
                        .catch(error => {
                            console.error(`Error fetching ${systemKey.toUpperCase()} list:`, error);
                            loadingState.innerHTML = `<div class="text-rose-400 text-xs font-mono font-medium">Failed to load games list. Check '${config.dataPath}' path.</div>`;
                        });
                }
            }

            function initFuse() {
                fuse = new Fuse(allGames, {
                    keys: ['name'],
                    threshold: 0.3, // Fuzzy search threshold (0.0 = exact match, 1.0 = match anything)
                    ignoreLocation: true
                });
            }

            // Switcher event listeners
            btnNes.addEventListener("click", () => { if (currentSystem !== 'nes') loadSystem('nes'); });
            btnSnes.addEventListener("click", () => { if (currentSystem !== 'snes') loadSystem('snes'); });
            btnAll.addEventListener("click", () => { if (currentSystem !== 'all') loadSystem('all'); });

            function filterAndRender(query = "", reset = false) {
                const trimmedQuery = query.trim();
                
                if (reset) {
                    if (trimmedQuery === "") {
                        filteredGames = allGames;
                    } else if (fuse) {
                        filteredGames = fuse.search(trimmedQuery).map(result => result.item);
                    } else {
                        filteredGames = allGames.filter(game => game.name.toLowerCase().includes(trimmedQuery.toLowerCase()));
                    }
                    displayedCount = 0;
                    container.innerHTML = "";
                }

                gameCountEl.textContent = filteredGames.length;

                if (filteredGames.length === 0) {
                    emptyState.style.display = "flex";
                    scrollLoader.style.display = "none";
                    return;
                } else {
                    emptyState.style.display = "none";
                }

                renderNextBatch();
            }

            function renderNextBatch() {
                if (displayedCount >= filteredGames.length) {
                    scrollLoader.style.display = "none";
                    return;
                }

                // If "ALL" is selected, render everything at once per user request
                const batchLimit = (currentSystem === 'all') ? filteredGames.length : BATCH_SIZE;
                const nextBatch = filteredGames.slice(displayedCount, displayedCount + batchLimit);
                
                if (nextBatch.length === 0) {
                    scrollLoader.style.display = "none";
                    return;
                }

                const fragment = document.createDocumentFragment();

                nextBatch.forEach(gameObj => {
                    const gameCard = document.createElement("a");
                    gameCard.href = `https://bundler3.readthedocs.io/retro.html?core=autodetect&rom=https://raw.githubusercontent.com/sigmiliarity/${gameObj.gitPath}/refs/heads/main/${encodeURIComponent(gameObj.name)}`;
                    gameCard.target = "_blank";
                    gameCard.rel = "noopener noreferrer";
                    gameCard.title = gameObj.name.replace(/\.[^/.]+$/, "");
                    
                    gameCard.className = "group bg-nes-900 hover:bg-nes-800 border border-nes-700 hover:border-emerald-500/50 rounded-xl p-3 transition-all flex items-center gap-3";

                    const iconBox = document.createElement("div");
                    iconBox.className = "w-8 h-8 rounded-lg bg-nes-950 border border-nes-700 flex items-center justify-center text-emerald-400 group-hover:text-emerald-300 shrink-0 transition-colors";
                    iconBox.innerHTML = `
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
                        </svg>
                    `;

                    const titleSpan = document.createElement("span");
                    titleSpan.className = "text-xs font-medium text-slate-300 group-hover:text-white transition-colors line-clamp-1 leading-snug";
                    titleSpan.textContent = gameObj.name.replace(/\.[^/.]+$/, "");

                    gameCard.appendChild(iconBox);
                    gameCard.appendChild(titleSpan);
                    fragment.appendChild(gameCard);
                });

                container.appendChild(fragment);
                displayedCount += nextBatch.length;

                if (displayedCount < filteredGames.length && currentSystem !== 'all') {
                    scrollLoader.style.display = "block";
                    if (document.documentElement.scrollHeight <= window.innerHeight + 300) {
                        renderNextBatch();
                    }
                } else {
                    scrollLoader.style.display = "none";
                }
            }

            // IntersectionObserver for infinite scrolling (active on NES/SNES)
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && displayedCount < filteredGames.length && currentSystem !== 'all') {
                    renderNextBatch();
                }
            }, { rootMargin: "600px" });

            observer.observe(scrollSentinel);

            // Fallback scroll listener
            window.addEventListener("scroll", () => {
                if (displayedCount < filteredGames.length && currentSystem !== 'all') {
                    const scrollPosition = window.innerHeight + window.scrollY;
                    const threshold = document.documentElement.scrollHeight - 400;
                    if (scrollPosition >= threshold) {
                        renderNextBatch();
                    }
                }
            });

            // Debounced Search Input Handler using Fuse.js
            let searchTimeout;
            searchInput.addEventListener("input", (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    filterAndRender(e.target.value, true);
                }, 150);
            });

            // Initial load
            loadSystem('nes');
        });
    </script>
</body>
</html>
